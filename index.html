<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dancel - HTML Form Activity</title>
</head>
<body>
    <h1>HTML Form</h1>

    <form action="#" method="post">
        <fieldset>
            <legend>Personal Information</legend>

            <p>
                <label for="name"><strong>Name:</strong></label>
                <input type="text" id="name" name="name" required>
            </p>

            <p>
                <label for="email"><strong>Email:</strong></label>
                <input type="email" id="email" name="email" required>
            </p>
        </fieldset>

        <fieldset>
            <legend>Gender</legend>
            <p><i>Select one option.</i></p>

            <p>
                <input type="radio" id="gender-male" name="gender" value="Male" required>
                <label for="gender-male">Male</label><br>

                <input type="radio" id="gender-female" name="gender" value="Female">
                <label for="gender-female">Female</label><br>

                <input type="radio" id="gender-other" name="gender" value="Other">
                <label for="gender-other">Other</label>
            </p>
        </fieldset>

        <fieldset>
            <legend>Hobbies</legend>
            <p><i>Select all that apply.</i></p>

            <ul>
                <li>
                    <input type="checkbox" id="hobby-reading" name="hobbies" value="Reading">
                    <label for="hobby-reading">Reading</label>
                </li>
                <li>
                    <input type="checkbox" id="hobby-traveling" name="hobbies" value="Traveling">
                    <label for="hobby-traveling">Traveling</label>
                </li>
                <li>
                    <input type="checkbox" id="hobby-sports" name="hobbies" value="Sports">
                    <label for="hobby-sports">Sports</label>
                </li>
            </ul>
        </fieldset>

        <p>
            <label for="comments"><strong>Additional Comments:</strong></label><br>
            <textarea id="comments" name="comments" rows="5" cols="40"></textarea>
        </p>

        <p><b>Note:</b> Please check your information before submitting the form.</p>

        <p>
            <button type="submit">Submit</button>
        </p>
    </form>
</body>
</html>
